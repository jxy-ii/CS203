services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: policy-impact-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-policy_impact}
      POSTGRES_USER: ${POSTGRES_USER:-policy_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-policy_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - policy-impact-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  policy-impact-postgres-data:
